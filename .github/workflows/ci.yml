name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/ ui/

      - name: Run Mypy Strict Typecheck
        run: |
          source .venv/bin/activate
          mypy --strict src/planpilot/

  test-and-eval:
    name: Test Suite & Offline Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Unit & Integration Tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short -m "not live and not smoke"

      - name: Run Offline Benchmark Evaluation Harness
        run: |
          source .venv/bin/activate
          python -m planpilot.cli eval --output results/

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: planpilot:latest
