[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planpilot"
version = "0.1.0"
description = "LLM copilot on top of a constraint-programming production scheduler"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "ortools>=9.9",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "duckdb>=0.10",
    "pandas>=2.1",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "openai>=1.12",
    "anthropic>=0.18",
    "streamlit>=1.31",
    "plotly>=5.18",
    "typer>=0.9",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "hypothesis>=6.98",
    "coverage>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
planpilot = "planpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/planpilot"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["A003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["planpilot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["planpilot"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that require a live LLM API key (deselect with '-m not live')",
]
